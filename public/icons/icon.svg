<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="brYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed330"/>
      <stop offset="100%" stop-color="#f7b731"/>
    </linearGradient>
    <linearGradient id="brGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26de81"/>
      <stop offset="100%" stop-color="#20bf6b"/>
    </linearGradient>
    <linearGradient id="brBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3867d6"/>
      <stop offset="100%" stop-color="#2d98da"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtly styled inner container -->
  <g filter="url(#shadow)">
    <!-- Stylized Diamond (Brazilian flag inspiration) -->
    <polygon points="256,100 420,256 256,412 92,256" fill="url(#brGreen)" opacity="0.95"/>
    <!-- Yellow Inner Diamond -->
    <polygon points="256,130 388,256 256,382 124,256" fill="url(#brYellow)"/>
    <!-- Blue Circle -->
    <circle cx="256" cy="256" r="82" fill="url(#brBlue)"/>
  </g>

  <!-- Open Book & Speech Waves Icon in Center -->
  <g fill="#ffffff">
    <!-- Stylized Book -->
    <path d="M 256 220 C 235 205, 200 205, 175 215 C 168 218, 164 225, 164 233 L 164 285 C 164 288, 167 291, 170 290 C 195 280, 230 280, 252 295 C 255 297, 257 297, 260 295 C 282 280, 317 280, 342 290 C 345 291, 348 288, 348 285 L 348 233 C 348 225, 344 218, 337 215 C 312 205, 277 205, 256 220 Z" fill="#ffffff" filter="url(#shadow)"/>
    <path d="M 256 225 L 256 295" stroke="#2d98da" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- "BR" Badge at bottom -->
  <g transform="translate(256, 335)">
    <rect x="-42" y="-14" width="84" height="28" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#4c1d95" text-anchor="middle" letter-spacing="1.5">LEARN</text>
  </g>
</svg>
